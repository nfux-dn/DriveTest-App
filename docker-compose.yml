services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: drivetest
      POSTGRES_PASSWORD: drivetest
      POSTGRES_DB: drivetest
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drivetest"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DRIVETEST_DATABASE_URL: postgresql+psycopg://drivetest:drivetest@db:5432/drivetest
      DRIVETEST_SESSION_SECRET: ${DRIVETEST_SESSION_SECRET:-dev-insecure-session-secret-change-me}
      DRIVETEST_SECRET_ENCRYPTION_KEY: ${DRIVETEST_SECRET_ENCRYPTION_KEY:-}
      DRIVETEST_CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      # Suite/test source of truth: "git" (index + run from the suites repo) or
      # "local" (dev: use the bind-mounted ./definitions for both).
      DRIVETEST_DEFINITIONS_SOURCE: ${DRIVETEST_DEFINITIONS_SOURCE:-git}
      DRIVETEST_SUITES_REPOSITORY: ${DRIVETEST_SUITES_REPOSITORY:-nfux-dn/DriveTest-Scripts}
      DRIVETEST_SUITES_BRANCH: ${DRIVETEST_SUITES_BRANCH:-main}
      # Optional system token so startup indexing works for a private suites repo
      # without a logged-in user (users can also Sync with their own GitHub token).
      DRIVETEST_SUITES_GIT_TOKEN: ${DRIVETEST_SUITES_GIT_TOKEN:-}
      DRIVETEST_SUITES_CACHE_DIR: /var/lib/drivetest/suites
      DRIVETEST_DEFINITIONS_DIR: /app/definitions
      DRIVETEST_WORKSPACES_DIR: /tmp/drivetest-workspaces
      DRIVETEST_GITHUB_CLIENT_ID: ${DRIVETEST_GITHUB_CLIENT_ID:-}
      DRIVETEST_GITHUB_CLIENT_SECRET: ${DRIVETEST_GITHUB_CLIENT_SECRET:-}
      DRIVETEST_AI_PROVIDER: ${DRIVETEST_AI_PROVIDER:-mock}
      DRIVETEST_OPENAI_API_KEY: ${DRIVETEST_OPENAI_API_KEY:-}
      DRIVETEST_OPENAI_MODEL: ${DRIVETEST_OPENAI_MODEL:-gpt-4o-mini}
      DRIVETEST_ANTHROPIC_API_KEY: ${DRIVETEST_ANTHROPIC_API_KEY:-}
      DRIVETEST_ANTHROPIC_MODEL: ${DRIVETEST_ANTHROPIC_MODEL:-claude-3-5-sonnet-latest}
      DRIVETEST_CURSOR_API_KEY: ${DRIVETEST_CURSOR_API_KEY:-}
      DRIVETEST_CURSOR_MODEL: ${DRIVETEST_CURSOR_MODEL:-}
      DRIVETEST_CURSOR_TIMEOUT_SECONDS: ${DRIVETEST_CURSOR_TIMEOUT_SECONDS:-120}
      DRIVETEST_SSH_TRANSPORT: ${DRIVETEST_SSH_TRANSPORT:-simulated}
      DRIVETEST_SSH_DEFAULT_USERNAME: ${DRIVETEST_SSH_DEFAULT_USERNAME:-admin}
      DRIVETEST_SSH_DEFAULT_PASSWORD: ${DRIVETEST_SSH_DEFAULT_PASSWORD:-}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./definitions:/app/definitions
      # Persist run workspaces/artifacts across backend restarts.
      - workspaces:/tmp/drivetest-workspaces
      # Cached clone of the suites repo (git mode single source of truth).
      - suites_cache:/var/lib/drivetest/suites

  frontend:
    image: node:20
    working_dir: /app
    depends_on:
      - backend
    environment:
      VITE_API_BASE: http://localhost:8000
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app

volumes:
  db_data:
  workspaces:
  suites_cache:
